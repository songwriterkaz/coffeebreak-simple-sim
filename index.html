<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b2417"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Coffeebreak Simple SIM</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fdf3ea;color:#3b2417;text-align:center;font-size:22px}
main{max-width:480px;margin:0 auto;padding:14px 16px 8px;min-height:100vh;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:center;gap:10px}header img{width:52px;height:52px;border-radius:12px}h1{font-size:24px;margin:0}
#st{font-size:26px;font-weight:700;min-height:34px}#st.ok{color:#178a3a}
button,input{font:inherit;border-radius:18px;border:0}input{padding:16px;border:2px solid #3b2417;width:100%;font-size:26px;text-align:center}
.big{padding:22px;font-size:30px;font-weight:800;color:#fff;background:#3b2417;width:100%}
#call{background:#1aa34a;font-size:44px;padding:38px 10px}#call.end{background:#d02b2b}#ans{background:#1aa34a;font-size:40px;padding:34px}
.row{display:flex;gap:10px}.sm{flex:1;padding:14px;font-size:20px;background:#ead7c5;color:#3b2417}.sm.on{background:#3b2417;color:#fff}
#qr{margin:0 auto;width:132px;height:132px;background:#fff;padding:6px;border-radius:10px}#qr img,#qr canvas{width:120px!important;height:120px!important}
.hide{display:none!important}small{font-size:14px;opacity:.8}footer{font-size:12px;opacity:.75;margin-top:auto;padding-top:10px}
</style></head><body><main>
<header><img src="logo.png" alt="Coffeebreak"><h1>Coffeebreak SIM</h1></header>
<section id="setup" class="hide"><p>Your name</p><input id="nm" maxlength="20" autocomplete="off"><p><button class="big" id="start">Start</button></p></section>
<section id="app" class="hide" style="display:flex;flex-direction:column;gap:14px">
<div id="me"></div><div id="st">Starting</div>
<select id="who" style="font:inherit;padding:10px;border-radius:14px"></select>
<button class="big" id="ans" hidden>Answer</button>
<button class="big" id="call">CALL</button>
<div class="row"><button class="sm" id="mute">Mute</button><button class="sm" id="pause">Pause</button></div>
<button class="big" id="share">Share my link</button>
<div id="qr"></div><small>Scan to call me</small>
</section>
<audio id="au" autoplay playsinline></audio>
<footer>© Karen O'Brien (Coffeebreak). All designs, music, art and content remain the property of Karen O'Brien. Your purchase gives you a personal-use licence only. It doesn't transfer ownership or allow resale, copying or redistribution.</footer>
</main>
<script src="app.js"></script>
<script src="qrcode.min.js" defer></script><script src="peerjs.min.js" defer></script>
</body></html>
